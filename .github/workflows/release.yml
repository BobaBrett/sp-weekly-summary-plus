name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version manifest.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match manifest.json version $manifest" >&2
            exit 1
          fi

      - name: Build plugin zip
        run: |
          zip -j "weekly-summary-plus-${GITHUB_REF_NAME}.zip" manifest.json index.html icon.svg
          cp "weekly-summary-plus-${GITHUB_REF_NAME}.zip" plugin.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "weekly-summary-plus-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
